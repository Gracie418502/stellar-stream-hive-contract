[package]
name = "stellar-stream-hive-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core streaming contract for Stellar Stream Hive: linear, per-ledger token streaming."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Real vault, used only by tests/vault_integration.rs so the Stream -> Vault
# call chain is exercised without a mock.
stellar-stream-hive-vault = { path = "../vault" }

[features]
testutils = ["soroban-sdk/testutils"]
