# Configuration for `cargo deny` (run in .github/workflows/audit.yml).
#
# Covers licenses, banned crates and crate sources. Vulnerability advisories
# stay in `cargo audit` (audit.toml), so they are not checked here.
# See CONTRIBUTING.md's "Dependency audits" section.

[graph]
all-features = true

[licenses]
version = 2
# Anything not listed here fails the job. The list matches the licenses the
# current dependency tree uses, verified by `cargo deny list`. To accept a new
# license, add its SPDX identifier here in the same PR and say why.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Duplicate versions of a crate are reported but do not fail the job. The
# Soroban SDK pulls in several major versions of common crates, and failing on
# that would block every PR.
multiple-versions = "warn"
wildcards = "deny"
# Crates that must never enter the tree. Add a crate here with a reason
# comment to ban it.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
