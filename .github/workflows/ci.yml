name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full test run to catch drift from yanked or changed dependencies.
  # Only the test job runs on this trigger (see the `if:` guards below).
  # 03:17 UTC keeps clear of the audit workflow's Monday 06:00 run.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'schedule'
    name: Lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify Cargo.lock is up to date
        run: |
          # --locked makes cargo refuse to rewrite Cargo.lock, so a Cargo.toml
          # change without a matching lockfile update fails here.
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::error file=Cargo.lock::Cargo.lock is out of date with Cargo.toml. Run 'cargo update -w' (or 'cargo build') locally and commit the updated Cargo.lock."
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      # too_many_arguments / needless_borrows_for_generic_args are inherent to
      # Soroban's ABI-driven function signatures and client call style.
      - name: Clippy
        run: >
          cargo clippy --workspace --all-targets -- -D warnings
          -A clippy::too_many_arguments
          -A clippy::needless_borrows_for_generic_args

  docs:
    if: github.event_name != 'schedule'
    name: Docs (rustdoc, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Build rustdoc with warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace test suite
        run: cargo test --workspace --verbose

  wasm-build:
    if: github.event_name != 'schedule'
    name: Build (wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build every contract to the real deployment artifact
        run: |
          cargo build --target wasm32v1-none --release \
            -p stellar-stream-hive-vault \
            -p stellar-stream-hive-stream \
            -p stellar-stream-hive-registry
      - name: Report WASM sizes
        run: |
          WASM_DIR="target/wasm32v1-none/release"
          {
            echo "### WASM artifact sizes"
            echo
            echo "| Contract | Size (bytes) |"
            echo "|---|---|"
            for f in stellar_stream_hive_vault stellar_stream_hive_stream stellar_stream_hive_registry; do
              echo "| $f.wasm | $(stat -c%s "$WASM_DIR/$f.wasm") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checksum WASM artifacts
        run: |
          WASM_DIR="target/wasm32v1-none/release"
          mkdir -p wasm-dist
          cp "$WASM_DIR"/stellar_stream_hive_vault.wasm \
             "$WASM_DIR"/stellar_stream_hive_stream.wasm \
             "$WASM_DIR"/stellar_stream_hive_registry.wasm \
             wasm-dist/
          (cd wasm-dist && sha256sum *.wasm > SHA256SUMS)
          cat wasm-dist/SHA256SUMS
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: |
            wasm-dist/stellar_stream_hive_vault.wasm
            wasm-dist/stellar_stream_hive_stream.wasm
            wasm-dist/stellar_stream_hive_registry.wasm
            wasm-dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
