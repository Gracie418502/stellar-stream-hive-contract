name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      # too_many_arguments / needless_borrows_for_generic_args are inherent to
      # Soroban's ABI-driven function signatures and client call style.
      - name: Clippy
        run: >
          cargo clippy --workspace --all-targets -- -D warnings
          -A clippy::too_many_arguments
          -A clippy::needless_borrows_for_generic_args

  unused-deps:
    name: Unused dependencies (cargo-machete)
    runs-on: ubuntu-latest
    # Informational for now: cargo-machete can report false positives (e.g.
    # deps used only via macros). Drop continue-on-error once the output is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Find unused dependencies
        run: cargo machete --with-metadata

  docs:
    name: Docs (rustdoc, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Build rustdoc with warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace test suite
        run: cargo test --workspace --verbose

  coverage:
    name: Test coverage (cargo-llvm-cov, informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect coverage and write job summary
        run: |
          cargo llvm-cov --workspace --summary-only > coverage.txt 2>&1 || true
          {
            echo "### Test coverage (informational, no threshold)"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  wasm-build:
    name: Build (wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build every contract to the real deployment artifact
        run: |
          cargo build --target wasm32v1-none --release \
            -p stellar-stream-hive-vault \
            -p stellar-stream-hive-stream \
            -p stellar-stream-hive-registry
      - name: Report WASM sizes
        run: |
          WASM_DIR="target/wasm32v1-none/release"
          {
            echo "### WASM artifact sizes"
            echo
            echo "| Contract | Size (bytes) |"
            echo "|---|---|"
            for f in stellar_stream_hive_vault stellar_stream_hive_stream stellar_stream_hive_registry; do
              echo "| $f.wasm | $(stat -c%s "$WASM_DIR/$f.wasm") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce WASM size budgets
        # Budgets are per contract, in bytes: roughly 25% headroom over the
        # sizes measured when they were set. Soroban's hard limit is 256 KiB.
        # If a legitimate change exceeds a budget, raise it here in the same PR
        # and explain the growth in the PR description.
        run: |
          WASM_DIR="target/wasm32v1-none/release"
          fail=0
          check() {
            local name="$1" budget="$2"
            local size
            size=$(stat -c%s "$WASM_DIR/$name.wasm")
            if [ "$size" -gt "$budget" ]; then
              echo "::error::$name.wasm is $size bytes, over the budget of $budget bytes."
              echo "To adjust, change the budget for $name in .github/workflows/ci.yml (wasm-build job)."
              fail=1
            else
              echo "$name.wasm: $size / $budget bytes"
            fi
          }
          check stellar_stream_hive_vault 24576
          check stellar_stream_hive_stream 57344
          check stellar_stream_hive_registry 32768
          exit $fail

  wasm-reproducible:
    name: Reproducible WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # Builds the same commit twice, in two different directories with their
      # own target dirs, and fails if the WASM sha256 sums differ. Differences
      # can come from absolute paths embedded in the binary (so the two builds
      # deliberately live at different paths), or from a different rustc or
      # linker. The toolchain is pinned in rust-toolchain.toml and above.
      - name: Build twice in separate directories and compare
        run: |
          set -euo pipefail
          CONTRACTS="stellar_stream_hive_vault stellar_stream_hive_stream stellar_stream_hive_registry"
          ROOT="${RUNNER_TEMP:-/tmp}/reproducible"
          rm -rf "$ROOT"
          for n in a b; do
            dir="$ROOT/build-$n"
            mkdir -p "$dir"
            git archive HEAD | tar -x -C "$dir"
            (
              cd "$dir"
              cargo build --target wasm32v1-none --release --locked \
                -p stellar-stream-hive-vault \
                -p stellar-stream-hive-stream \
                -p stellar-stream-hive-registry \
                --target-dir "$dir/target"
            )
          done
          fail=0
          for c in $CONTRACTS; do
            ha=$(sha256sum "$ROOT/build-a/target/wasm32v1-none/release/$c.wasm" | cut -d' ' -f1)
            hb=$(sha256sum "$ROOT/build-b/target/wasm32v1-none/release/$c.wasm" | cut -d' ' -f1)
            if [ "$ha" != "$hb" ]; then
              echo "::error::$c.wasm is not reproducible"
              echo "  build-a sha256: $ha"
              echo "  build-b sha256: $hb"
              fail=1
            else
              echo "$c.wasm reproducible: $ha"
            fi
          done
          exit $fail
