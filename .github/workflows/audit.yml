name: Security audit

on:
  pull_request:
    branches: [main]
  schedule:
    # Catches newly published advisories against dependencies that haven't
    # changed since the last PR.
    - cron: '0 6 * * 1'

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # License, banned-crate and source rules live in deny.toml. Advisories
      # are checked by the cargo audit job below, not here.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Ignored advisories (acknowledged false positives / accepted risk)
      # live in audit.toml — see CONTRIBUTING.md's "Dependency audits"
      # section for how to add one.
      - name: cargo audit
        run: cargo audit
